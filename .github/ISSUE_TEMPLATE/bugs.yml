name: Bug report
description: Report behavior that does not work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Enter the HyperCodecs version or commit. Write unknown if you cannot find it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Enter your operating system, version, architecture and .NET runtime.
      placeholder: Windows 11, x64, .NET 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give numbered steps from opening the file to the problem. Name the container, the codec and the calls made. Say how often it happens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happens instead. Include the exact error if there is one.
    validations:
      required: true
  - type: textarea
    id: completion-checks
    attributes:
      label: Completion checks
      description: Describe how to confirm the fix. Include related behavior that must keep working.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add a short sample file, log or related issue if available.
