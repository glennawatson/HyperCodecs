name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@315788024be8e61daa4f2b957e6476746211b522 # main
    with:
      srcFolder: 'src'
      solutionFile: HyperCodecs.slnx
      minverTagPrefix: ''
      uploadCodecov: false
      testTimeout: '25m'
      installWorkloads: true
      dotnetVersions: |
        11.x
        10.x
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@315788024be8e61daa4f2b957e6476746211b522 # main
        with:
          src-folder: 'src'
          solution-file: HyperCodecs.slnx
          install-workloads: 'true'
          stamp-version: 'false'
          dotnet-versions: |
            11.x
            10.x
      - name: Setup Java for the Android SDK
        if: matrix.name == 'Linux arm64' || matrix.name == 'Windows arm64'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Android SDK (arm64 runners do not have it)
        if: matrix.name == 'Linux arm64' || matrix.name == 'Windows arm64'
        working-directory: src
        env:
          AndroidSdkDirectory: ${{ runner.temp }}/android-sdk
        run: |
          dotnet build HyperCodecs.Platform/HyperCodecs.Platform.csproj -t:InstallAndroidDependencies -f net10.0-android36.0 -p:AcceptAndroidSDKLicenses=True -v q --nologo
          dotnet build HyperCodecs.Platform/HyperCodecs.Platform.csproj -t:InstallAndroidDependencies -f net11.0-android37 -p:AcceptAndroidSDKLicenses=True -v q --nologo
      - name: Test on net10.0 and net11.0 (arm64 with the installed Android SDK)
        if: matrix.name == 'Linux arm64' || matrix.name == 'Windows arm64'
        working-directory: src
        env:
          AndroidSdkDirectory: ${{ runner.temp }}/android-sdk
        run: dotnet test --solution HyperCodecs.slnx -c Release -v q --nologo
      - name: Test on net10.0 and net11.0
        if: matrix.name != 'Linux arm64' && matrix.name != 'Windows arm64'
        working-directory: src
        run: dotnet test --solution HyperCodecs.slnx -c Release -v q --nologo
