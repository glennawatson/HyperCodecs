name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: Build, test, and analyze
    # Fork PRs get no SONAR_TOKEN, so they are skipped rather than failed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      # Composite actions cannot declare secret inputs, so the sonarcloud action reads this from env.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        id: environment
        uses: glennawatson/actions-common/.github/actions/dotnet-environment@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          src-folder: 'src'
          solution-file: HyperCodecs.slnx
          install-workloads: 'true'
          minver-tag-prefix: ''
          minver-minimum-major-minor: '0.1'
          dotnet-versions: |
            11.x
            10.x

      - name: SonarCloud begin
        id: sonar-begin
        uses: glennawatson/actions-common/.github/actions/sonarcloud@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          mode: begin
          project-key: glennawatson_HyperCodecs
          organization: glennawatson
          version: ${{ steps.environment.outputs.version-semver2 }}
          exclusions: '**/tests/**,**/benchmarks/**'
          coverage-exclusions: '**/tests/**,**/benchmarks/**'
          # H265CabacInitValues holds the three initialisation tables of the specification, which share their layout by design.
          cpd-exclusions: '**/tests/**,**/benchmarks/**,**/H265CabacInitValues.cs'
          test-exclusions: '**/tests/**,**/benchmarks/**'
          working-directory: src

      - name: Build
        uses: glennawatson/actions-common/.github/actions/dotnet-build@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          solution-file: HyperCodecs.slnx

      - name: Test
        uses: glennawatson/actions-common/.github/actions/dotnet-test@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          solution-file: HyperCodecs.slnx
          test-projects: tests/**/*.csproj
          test-timeout: 25m

      - name: SonarCloud end
        # A failed build or test still uploads partial analysis.
        if: ${{ !cancelled() && steps.sonar-begin.outcome == 'success' }}
        uses: glennawatson/actions-common/.github/actions/sonarcloud@7f2014219353aee799dfeef2a9b97acaeabca0b8 # main
        with:
          mode: end
          project-key: glennawatson_HyperCodecs
          working-directory: src
