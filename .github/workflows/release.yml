name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag.'
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). Empty = stable release.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@315788024be8e61daa4f2b957e6476746211b522 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Compute version and tag
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@315788024be8e61daa4f2b957e6476746211b522 # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'

  pack-nuget:
    name: Pack the NuGet library
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@315788024be8e61daa4f2b957e6476746211b522 # main
      with:
        src-folder: '.'
        stamp-version: 'false'
        dotnet-versions: |
          11.x
          10.x
    - name: Pack HyperCodecs
      run: dotnet pack src/HyperCodecs/HyperCodecs.csproj -c Release -o artifacts/nuget "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Pack HyperCodecs.Platform
      run: dotnet pack src/HyperCodecs.Platform/HyperCodecs.Platform.csproj -c Release -o artifacts/nuget "-p:Version=$VERSION" "-p:MinVerVersionOverride=$VERSION"
    - name: Upload the package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet
    needs: [version, pack-nuget]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@315788024be8e61daa4f2b957e6476746211b522 # main
      with:
        stamp-version: 'false'
        dotnet-versions: |
          11.x
    - name: Download the package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: packages
    - name: NuGet login (OIDC trusted publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  release:
    name: Create release (${{ needs.version.outputs.version }})
    needs: [version, publish-nuget]
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@315788024be8e61daa4f2b957e6476746211b522 # main
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      artifactName: release-assets
      assetGlob: '*'
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
